name: NativeCmpKit tag preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the tag revision and NativeCmpKit publication roots
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          python3 -B scripts/migration/plan_tag_release.py --ref "$GITHUB_REF"
