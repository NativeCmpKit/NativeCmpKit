# Modified for nativeCmpkit (2026-10-26): owner-authorized verification only.
# Manual native verification only. Reports-only recovery uploads; no native payload,
# signing, release or package publication.
name: NativeCmpKit native verification
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Native scope; lock reproducibility and macOS recovery do not replay accepted UI suites
        type: choice
        required: true
        default: all
        options: [identity-linux, identity-linux-android, identity-linux-browser, identity-linux-package, identity-apple, identity-apple-app, identity-windows, identity-windows-share, all, picker-jni-macos-domain, native-lock-reproducibility, native-lock-windows-source]
permissions:
  contents: read
concurrency:
  group: nativecmpkit-native-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  native-check:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'all'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - name: Linux native dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwayland-dev
      - name: File-picker native checks
        working-directory: nativecmpkit-file-picker/native
        run: cargo test --locked
      - name: Share native checks
        working-directory: nativecmpkit-share/native
        run: cargo test --locked

  native-lock-tooling:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && (inputs.profile == 'native-lock-reproducibility' || inputs.profile == 'native-lock-windows-source')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Important cache/source/refusal/controller tests only; zero native runtime tests
        if: inputs.profile == 'native-lock-reproducibility'
        run: python3 -B -m unittest discover -s scripts/ci -p test_native_lock_reproducibility.py -v
      - name: Changed checkout and finite Windows-only recovery guards; no accepted host replay
        if: inputs.profile == 'native-lock-windows-source'
        run: python3 -B -m unittest discover -s scripts/ci -p test_native_lock_windows_workflow.py -v

  native-lock-reproducibility:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'native-lock-reproducibility'
    needs: native-lock-tooling
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            python: python3
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python: python3
          - platform: macos-arm64
            runner: macos-26
            python: python3
          - platform: macos-x64
            runner: macos-26-intel
            python: python3
          - platform: windows-x64
            runner: windows-2025
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Before checkout: retain long archives and the exact source bytes on Windows.
    # Repository/job-local Git configuration only; no machine-wide changes.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - name: Linux native Wayland build metadata only
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev pkg-config
      - name: Two empty-cache locked builds of both crates; no accepted UI/native test replay
        run: ${{ matrix.python }} scripts/ci/native_lock_reproducibility.py --platform ${{ matrix.platform }} --output build/ci-verification/native-lock-${{ matrix.platform }}
      - name: Preserve JSON receipts and complete locked graphs only, including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-evidence-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: build/ci-verification/native-lock-${{ matrix.platform }}/*.json

  native-lock-windows-source:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'native-lock-windows-source'
    needs: native-lock-tooling
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - name: Recover only the failed actual Windows host; no accepted Linux or macOS replay
        run: python scripts/ci/native_lock_reproducibility.py --platform windows-x64 --output build/ci-verification/native-lock-windows-x64
      - name: Preserve JSON receipts only, including failed stages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-evidence-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: build/ci-verification/native-lock-windows-x64/*.json

  picker-jni-macos-domain:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'picker-jni-macos-domain'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - name: Important finite JNI receipt regressions only; not native/library executions
        run: python3 -B -m unittest discover -s scripts/ci -p test_picker_jni_paths.py -v
      - name: Record the actual clean macOS arm64 JDK17 Rust and Xcode runtime
        id: runtime
        run: python3 scripts/ci/runtime_context.py --expected-arch arm64 --require-clean --apple --output build/ci-runtime/picker-jni-macos.json
      - name: Recover only actual filesystem-domain and four controlled negative JNI methods
        run: python3 scripts/ci/picker_jni_paths.py --focus macos-domain --output build/ci-verification/picker-jni-macos-domain
      - name: Preserve JSON receipts only, including failures; never native executables or logs
        if: always() && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: picker-jni-macos-domain-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-runtime/picker-jni-macos.json
            build/ci-verification/picker-jni-macos-domain/*.json

  identity-verification:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && startsWith(inputs.profile, 'identity-')
    runs-on: ${{ startsWith(inputs.profile, 'identity-apple') && 'macos-26' || startsWith(inputs.profile, 'identity-windows') && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.profile == 'identity-apple-app' && 90 || 60 }}
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          min-wrapper-count: 1
          allow-snapshots: false
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwayland-dev xvfb xauth
      - name: Set up pinned Rust
        id: rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Install the official Android SDK platform
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install 'cmdline-tools;23.0' 'platforms;android-37.0'
      - name: Source identity and migration checks
        if: runner.os == 'Linux'
        run: |
          python3 scripts/development/verify_namespace.py
          python3 scripts/migration/verify_migration.py
          python3 scripts/audit/source_inventory.py --check
          python3 scripts/development/validate_resolutions.py --check
          python3 scripts/development/generate_icon_catalogues.py --check
      - name: Linux desktop tests
        if: inputs.profile == 'identity-linux'
        run: |
          xvfb-run -a ./gradlew desktopTest --continue --max-workers=1 \
            --no-parallel --no-configuration-cache --no-build-cache
      - name: Android host tests and sample APK
        if: inputs.profile == 'identity-linux-android'
        run: |
          ./gradlew testAndroidHostTest :sample:android:assembleDebug --continue --max-workers=1 \
            --no-parallel --no-configuration-cache --no-build-cache
      - name: Linux browser tests and sample compilation
        if: inputs.profile == 'identity-linux-browser'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          xvfb-run -a ./gradlew jsBrowserTest wasmJsBrowserTest \
            :sample:web-js:compileKotlinJs :sample:web-wasm:compileKotlinWasmJs \
            --continue --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Stage isolated desktop publications
        if: inputs.profile == 'identity-linux-package'
        run: |
          ./gradlew stageVerificationPublications \
            -PnativecmpkitVerification=true -PnativecmpkitVerificationTargets=desktop \
            --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Apple simulator tests and sample framework
        if: inputs.profile == 'identity-apple'
        run: |
          ./gradlew iosSimulatorArm64Test :sample:common:linkDebugFrameworkIosSimulatorArm64 \
            :sample:common:linkDebugFrameworkIosArm64 \
            --continue --max-workers=2 --no-configuration-cache --no-build-cache
      - name: Tests requiring an owned UIKit application
        if: inputs.profile == 'identity-apple-app'
        shell: bash
        run: |
          python3 scripts/ci/runtime_context.py --expected-arch arm64 --apple --select-simulator iphone \
            --output build/ci-identity/simulator.json
          device="$(python3 -c 'import json; print(json.load(open("build/ci-identity/simulator.json"))["simulator"]["udid"])')"
          state="$(python3 -c 'import json; print(json.load(open("build/ci-identity/simulator.json"))["simulator"]["state"])')"
          if [[ "$state" == Shutdown ]]; then
            xcrun simctl boot "$device"
            trap 'xcrun simctl shutdown "$device"' EXIT
          elif [[ "$state" != Booted ]]; then
            exit 1
          fi
          xcrun simctl bootstatus "$device" -b
          ./gradlew iosSimulatorArm64ApplicationTest -PnativecmpkitSimulatorDevice="$device" \
            --continue --max-workers=2 --no-parallel --no-configuration-cache --no-build-cache
      - name: Windows desktop tests
        if: inputs.profile == 'identity-windows'
        shell: cmd
        run: gradlew.bat :nativecmpkit-file-picker:desktopTest :nativecmpkit-share:desktopTest --continue --max-workers=2 --no-configuration-cache --no-build-cache
      - name: Windows share fixture recovery
        if: inputs.profile == 'identity-windows-share'
        shell: cmd
        run: gradlew.bat :nativecmpkit-share:desktopTest --tests "io.github.apdelrahman1911.nativecmpkit.share.platform.NativeCacheProcessIntegrationTest.differentCompiledNativeVersionsRaceInSeparateJvmsAndRetainTheirOwnDigestAndJniValue" --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache --info
      - name: Native crate tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && (inputs.profile == 'identity-linux' || inputs.profile == 'identity-apple' || inputs.profile == 'identity-windows') }}
        shell: bash
        run: |
          cargo test --locked --manifest-path nativecmpkit-file-picker/native/Cargo.toml
          cargo test --locked --manifest-path nativecmpkit-share/native/Cargo.toml
      - name: Summarize available Gradle test reports
        if: always() && steps.checkout.outcome == 'success'
        shell: bash
        run: python scripts/audit/summarize_junit.py --output build/ci-identity/junit-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.checkout.outcome == 'success'
        with:
          name: ${{ inputs.profile }}-junit-summary
          path: build/ci-identity/junit-summary.json
          if-no-files-found: error
