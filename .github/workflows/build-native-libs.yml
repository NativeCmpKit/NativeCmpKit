# Modified for nativeCmpkit (2026-10-26): owner-authorized verification only.
# Manual native verification only. Reports-only recovery uploads; no native payload,
# signing, release or package publication.
name: NativeCmpKit native verification
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Native scope; lock reproducibility and macOS recovery do not replay accepted UI suites
        type: choice
        required: true
        default: all
        options: [identity-linux, identity-linux-picker, identity-linux-picker-mime, identity-linux-webview, identity-linux-android, identity-linux-android-recovery, identity-linux-android-webview-device, identity-linux-android-webview-restore, identity-linux-android-consumer-webview, identity-linux-android-ownership, identity-linux-android-remote-io, identity-linux-android-remote-io-cancel, identity-linux-browser, identity-linux-browser-camera, identity-linux-package, identity-linux-arm64-package, identity-linux-consumer, identity-apple, identity-apple-app, identity-apple-ui, identity-apple-ui-pre26, identity-apple-ui-pre26-diagnostic, identity-apple-main-ui, identity-apple-ui-date-range, identity-apple-ui-bitmap-raster, identity-apple-ui-action-sheet, identity-apple-ui-ipad-popover, identity-apple-ui-ipad-rotation, identity-apple-camera, identity-apple-camera-disposal, identity-apple-ownership, identity-apple-appkit-share, identity-apple-webview, identity-apple-webview-restore, identity-apple-framework, identity-apple-sample, identity-apple-package, identity-apple-intel-package, identity-apple-consumer-package, identity-apple-consumer-desktop-package, identity-apple-consumer-wkwebview, identity-windows, identity-windows-share, identity-windows-package, openjfx-source-linux-x64, openjfx-source-linux-arm64, openjfx-source-macos-x64, openjfx-source-macos-arm64, openjfx-source-windows-x64, all, picker-jni-macos-domain, native-lock-reproducibility, native-lock-windows-source]
permissions:
  contents: read
concurrency:
  group: nativecmpkit-native-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: false
jobs:
  openjfx-source-sdk:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && startsWith(inputs.profile, 'openjfx-source-')
    runs-on: ${{ fromJSON('{"openjfx-source-linux-x64":"ubuntu-24.04","openjfx-source-linux-arm64":"ubuntu-24.04-arm","openjfx-source-macos-x64":"macos-26-intel","openjfx-source-macos-arm64":"macos-26","openjfx-source-windows-x64":"windows-2022"}')[inputs.profile] }}
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
      SOURCE_DIR: build/openjfx-source
      SOURCE_ARCH: ${{ endsWith(inputs.profile, 'arm64') && 'arm64' || 'x64' }}
      SOURCE_OS: ${{ startsWith(inputs.profile, 'openjfx-source-macos-') && 'macos' || inputs.profile == 'openjfx-source-windows-x64' && 'windows' || 'linux' }}
      SOURCE_CHECK: tests/dependency/javafx-http2-cancellation/verify_source_sdk.py
      EVIDENCE_DIR: build/openjfx-source-verification
    steps:
      - name: Preserve exact source line endings on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: openjdk/jfx21u
          ref: refs/tags/21.0.13.1+1
          path: build/openjfx-source
          persist-credentials: false
      - name: Bind OpenJFX source and build materials before compilation
        run: python3 -B "$SOURCE_CHECK" prepare --source "$SOURCE_DIR" --output "$EVIDENCE_DIR" --platform "$SOURCE_OS"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          verify-signature: true
          overwrite-settings: false
      - name: Install and record the hosted Linux build environment
        if: runner.os == 'Linux'
        run: |
          ubuntu_apt=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${ubuntu_apt[@]}" update
          sudo apt-get "${ubuntu_apt[@]}" install --no-install-recommends -y bison cmake flex g++ gperf libasound2-dev \
            libfreetype-dev libgl1-mesa-dev libgtk-3-dev libpango1.0-dev libx11-dev libxxf86vm-dev \
            libxtst-dev ninja-build perl pkg-config ruby xauth xvfb
          {
            uname -sm
            cat /etc/os-release
            df -h .
            java -version
            gcc --version
            cmake --version
            ninja --version
            pkg-config --modversion gtk+-3.0
            dpkg-query -W
          } > "$EVIDENCE_DIR/toolchain.txt" 2>&1
          grep -F 'Temurin-17.0.21+9' "$EVIDENCE_DIR/toolchain.txt"
          available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
          test "$available_kib" -ge $((12 * 1024 * 1024))
      - name: Verify and record the hosted macOS build environment
        if: runner.os == 'macOS'
        run: |
          cmake_root="$RUNNER_TEMP/openjfx-cmake"
          mkdir "$cmake_root"
          tar -xzf "$EVIDENCE_DIR/sources/cmake-3.31.12-macos-universal.tar.gz" -C "$cmake_root" --strip-components=1
          cmake_bin="$cmake_root/CMake.app/Contents/bin"
          export PATH="$cmake_bin:$PATH"
          printf '%s\n' "$cmake_bin" >> "$GITHUB_PATH"
          {
            uname -sm
            sw_vers
            df -h .
            java -version
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            clang --version
            cmake --version
            ninja --version
            ruby --version
            gperf --version
          } > "$EVIDENCE_DIR/toolchain.txt" 2>&1
          grep -F 'Temurin-17.0.21+9' "$EVIDENCE_DIR/toolchain.txt"
          grep -F 'cmake version 3.31.12' "$EVIDENCE_DIR/toolchain.txt"
          available_kib=$(df -Pk . | awk 'NR == 2 {print $4}')
          test "$available_kib" -ge $((12 * 1024 * 1024))
      - name: Build the complete SDK and native WebKit from source
        if: runner.os != 'Windows'
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/openjfx-gradle
          BUILD_AV_STUBS: ${{ runner.os == 'Linux' && 'true' || 'false' }}
        run: |
          ivy_path="$GITHUB_WORKSPACE/$EVIDENCE_DIR/ivy"
          if (
            cd "$SOURCE_DIR"
            SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
            export SOURCE_DATE_EPOCH
            set -x
            bash gradlew --no-daemon --offline --max-workers=2 --console=plain sdk \
              -PCOMPILE_WEBKIT=true -PCOMPILE_MEDIA=true -PNUM_COMPILE_THREADS=2 \
              -PBUILD_LIBAV_STUBS="$BUILD_AV_STUBS" -PBUILD_WORKING_LIBAV=false \
              -PicuVersion=77.1 -PJFX_DEPS_URL="file://$ivy_path"
          ) 2>&1 | tee "$EVIDENCE_DIR/build.log"; then
            printf '0\n' > "$EVIDENCE_DIR/build-exit.txt"
          else
            status=$?
            printf '%s\n' "$status" > "$EVIDENCE_DIR/build-exit.txt"
            exit "$status"
          fi
      - name: Install and record the hosted Windows build environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = (Resolve-Path $env:EVIDENCE_DIR).Path
          $cygwin = Join-Path $env:RUNNER_TEMP 'openjfx-cygwin'
          $cache = Join-Path $env:RUNNER_TEMP 'openjfx-cygwin-packages'
          New-Item -ItemType Directory -Path $cache | Out-Null
          $install = Start-Process -Wait -NoNewWindow -PassThru -FilePath "$evidence/sources/setup-2.941.x86_64.exe" -ArgumentList @(
            '--quiet-mode', '--only-site', '--no-admin', '--no-desktop', '--no-shortcuts', '--no-startmenu',
            '--root', "`"$cygwin`"", '--local-package-dir', "`"$cache`"", '--site', 'https://mirrors.kernel.org/sourceware/cygwin',
            '--packages', 'make,zip,unzip,makedepend,bison,flex,perl,python3,ruby,rubygems,gperf'
          )
          if ($install.ExitCode -ne 0) { throw "Cygwin setup exited $($install.ExitCode)" }
          Copy-Item "$cygwin/etc/setup/installed.db" "$evidence/cygwin-installed.txt"
          $cmake = Join-Path $env:RUNNER_TEMP 'openjfx-cmake'
          Expand-Archive "$evidence/sources/cmake-3.31.12-windows-x86_64.zip" $cmake
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Expected the hosted Visual Studio 2022 C++ toolchain' }
          $vsTools = Join-Path $vs 'VC/Auxiliary/Build'
          $msvc = (Get-Content "$vsTools/Microsoft.VCToolsVersion.default.txt" -TotalCount 1).Trim()
          $jdk = (& java -version 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $jdk -notmatch 'Temurin-17\.0\.21\+9') { throw 'Expected the pinned Temurin boot JDK' }
          $windowsPath = "$cmake/cmake-3.31.12-windows-x86_64/bin;$cygwin/bin"
          $env:Path = "$windowsPath;$env:Path"
          $gem = (& "$cygwin/bin/cygpath.exe" -u "$evidence/sources/getoptlong-0.2.1.gem").Trim()
          & "$cygwin/bin/bash.exe" -lc "gem install --local --ignore-dependencies --no-document '$gem'"
          if ($LASTEXITCODE -ne 0) { throw 'Installing the verified Ruby option parser failed' }
          @(
            $jdk
            "Visual Studio: $vs"
            "MSVC version: $msvc"
            (& cmake --version)
            (& clang-cl --version)
            (& ninja --version)
            (& "$cygwin/bin/bash.exe" -lc 'ruby --version && python3 --version && gperf --version && bison --version')
            (Get-PSDrive $PWD.Drive.Name | Format-Table | Out-String)
          ) | Set-Content "$evidence/toolchain.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Windows native build tool inventory failed' }
          if ((Get-PSDrive $PWD.Drive.Name).Free -lt 12GB) { throw 'Require 12 GiB for the native SDK build' }
          "OPENJFX_WINDOWS_PATH=$windowsPath" >> $env:GITHUB_ENV
          "VS150COMNTOOLS=$vsTools" >> $env:GITHUB_ENV
          "WINDOWS_CRT_VER=143" >> $env:GITHUB_ENV
          "Python3_ROOT_DIR=$cygwin" >> $env:GITHUB_ENV
      - name: Build the complete Windows SDK and native WebKit from source
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/openjfx-gradle
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = (Resolve-Path $env:EVIDENCE_DIR).Path
          $ivy = ([Uri](Join-Path $evidence 'ivy')).AbsoluteUri
          $nativeBuildPath = "$env:OPENJFX_WINDOWS_PATH;$env:Path"
          Remove-Item Env:Path
          $env:PATH = $nativeBuildPath
          Set-Location $env:SOURCE_DIR
          $env:SOURCE_DATE_EPOCH = (& git log -1 --format=%ct).Trim()
          $gradleArguments = @('--no-daemon', '--offline', '--max-workers=2', '--console=plain', 'sdk',
            '-PCOMPILE_WEBKIT=true', '-PCOMPILE_MEDIA=true', '-PNUM_COMPILE_THREADS=2',
            '-PCHMOD_ARTIFACTS=false', '-PBUILD_LIBAV_STUBS=false', '-PicuVersion=77.1', "-PJFX_DEPS_URL=$ivy")
          ('.\gradlew.bat ' + ($gradleArguments -join ' ')) | Tee-Object -FilePath "$evidence/build.log"
          & .\gradlew.bat @gradleArguments 2>&1 | Tee-Object -FilePath "$evidence/build.log" -Append
          $status = $LASTEXITCODE
          $status | Set-Content "$evidence/build-exit.txt"
          exit $status
      - name: Inspect SDK binaries and run the real WebView cancellation cases
        run: python3 -B "$SOURCE_CHECK" verify --source "$SOURCE_DIR" --output "$EVIDENCE_DIR" --platform "$SOURCE_OS" --arch "$SOURCE_ARCH"
      - name: Provision the library consumer build SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: cmdline-tools;23.0 platforms;android-37.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Test the staged WebView with the source-built OpenJFX runtime
        run: |
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          host="$SOURCE_OS-$SOURCE_ARCH"
          command=(python3 -B scripts/ci/webview_consumer.py --host "$host" --source-javafx
            --output build/ci-webview-consumer/source-sdk)
          if [[ "$SOURCE_OS" == linux ]]; then command=(xvfb-run -a "${command[@]}"); fi
          "${command[@]}"
      - name: Preserve source-build and cancellation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ inputs.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/openjfx-source-verification/source.json
            build/openjfx-source-verification/source-tree.tsv
            build/openjfx-source-verification/legal-source-inventory.json
            build/openjfx-source-verification/toolchain.txt
            build/openjfx-source-verification/cygwin-installed.txt
            build/openjfx-source-verification/build.log
            build/openjfx-source-verification/build-exit.txt
            build/openjfx-source-verification/sdk-binaries.json
            build/openjfx-source-verification/native-binary-inventory.txt
            build/openjfx-source-verification/loader-cancellation.txt
            build/openjfx-source-verification/probe-execution.json
            build/openjfx-source-verification/probe.stdout
            build/openjfx-source-verification/probe.stderr
            build/openjfx-source-verification/case-results.json
            build/openjfx-source-verification/lifecycle-execution.json
            build/openjfx-source-verification/lifecycle.stdout
            build/openjfx-source-verification/lifecycle.stderr
            build/openjfx-source-verification/lifecycle-results.json
            build/openjfx-source-verification/http2-peer.stderr
            build/openjfx-source-verification/http2-probe-execution.json
            build/openjfx-source-verification/http2-probe.stdout
            build/openjfx-source-verification/http2-probe.stderr
            build/openjfx-source-verification/http2-results.json
            build/openjfx-source-verification/navigation-*-execution.json
            build/openjfx-source-verification/navigation-*.stdout
            build/openjfx-source-verification/navigation-*.stderr
            build/openjfx-source-verification/navigation-performance.json
            build/openjfx-source-verification/javafx-consumer-jars.json
            build/ci-webview-consumer/source-sdk/*.json
            build/ci-webview-consumer/source-sdk/*/*.json
            build/ci-webview-consumer/source-sdk/*/junit/*.xml

  native-check:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'all'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - name: Linux native dialog dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwayland-dev
      - name: File-picker native checks
        working-directory: nativecmpkit-file-picker/native
        run: cargo test --locked
      - name: Share native checks
        working-directory: nativecmpkit-share/native
        run: cargo test --locked

  native-lock-tooling:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && (inputs.profile == 'native-lock-reproducibility' || inputs.profile == 'native-lock-windows-source')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Important cache/source/refusal/controller tests only; zero native runtime tests
        if: inputs.profile == 'native-lock-reproducibility'
        run: PYTHONPATH=scripts/ci python3 -B -m unittest test_native_lock_reproducibility -v
      - name: Changed checkout and finite Windows-only recovery guards; no accepted host replay
        if: inputs.profile == 'native-lock-windows-source'
        run: PYTHONPATH=scripts/ci python3 -B -m unittest test_native_lock_windows_workflow -v

  native-lock-reproducibility:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'native-lock-reproducibility'
    needs: native-lock-tooling
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            python: python3
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            python: python3
          - platform: macos-arm64
            runner: macos-26
            python: python3
          - platform: macos-x64
            runner: macos-26-intel
            python: python3
          - platform: windows-x64
            runner: windows-2025
            python: python
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Before checkout: retain long archives and the exact source bytes on Windows.
    # Repository/job-local Git configuration only; no machine-wide changes.
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - name: Linux native Wayland build metadata only
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev pkg-config
      - name: Two empty-cache locked builds of both crates; no accepted UI/native test replay
        run: ${{ matrix.python }} scripts/ci/native_lock_reproducibility.py --platform ${{ matrix.platform }} --output build/ci-verification/native-lock-${{ matrix.platform }}
      - name: Preserve JSON receipts and complete locked graphs only, including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-evidence-${{ matrix.platform }}
          retention-days: 7
          if-no-files-found: error
          path: build/ci-verification/native-lock-${{ matrix.platform }}/*.json

  native-lock-windows-source:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'native-lock-windows-source'
    needs: native-lock-tooling
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - name: Recover only the failed actual Windows host; no accepted Linux or macOS replay
        run: python scripts/ci/native_lock_reproducibility.py --platform windows-x64 --output build/ci-verification/native-lock-windows-x64
      - name: Preserve JSON receipts only, including failed stages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-lock-evidence-windows-x64
          retention-days: 7
          if-no-files-found: error
          path: build/ci-verification/native-lock-windows-x64/*.json

  picker-jni-macos-domain:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && inputs.profile == 'picker-jni-macos-domain'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: '1.98.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - name: Important finite JNI receipt regressions only; not native/library executions
        run: PYTHONPATH=scripts/ci python3 -B -m unittest test_picker_jni_paths -v
      - name: Record the actual clean macOS arm64 JDK17 Rust and Xcode runtime
        id: runtime
        run: python3 scripts/ci/runtime_context.py --expected-arch arm64 --require-clean --apple --output build/ci-runtime/picker-jni-macos.json
      - name: Recover only actual filesystem-domain and four controlled negative JNI methods
        run: python3 scripts/ci/picker_jni_paths.py --focus macos-domain --output build/ci-verification/picker-jni-macos-domain
      - name: Preserve JSON receipts only, including failures; never native executables or logs
        if: always() && steps.runtime.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: picker-jni-macos-domain-evidence
          retention-days: 7
          if-no-files-found: error
          path: |
            build/ci-runtime/picker-jni-macos.json
            build/ci-verification/picker-jni-macos-domain/*.json

  identity-verification:
    if: github.repository == 'NativeCmpKit/NativeCmpKit' && github.event_name == 'workflow_dispatch' && startsWith(inputs.profile, 'identity-')
    runs-on: ${{ inputs.profile == 'identity-linux-arm64-package' && 'ubuntu-24.04-arm' || inputs.profile == 'identity-apple-intel-package' && 'macos-26-intel' || (inputs.profile == 'identity-apple-ui-pre26' || inputs.profile == 'identity-apple-ui-pre26-diagnostic') && 'macos-15' || (inputs.profile == 'identity-apple-camera' || inputs.profile == 'identity-apple-camera-disposal') && 'xcode-27' || startsWith(inputs.profile, 'identity-apple') && 'macos-26' || startsWith(inputs.profile, 'identity-windows') && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ (inputs.profile == 'identity-apple-app' || inputs.profile == 'identity-apple-package' || inputs.profile == 'identity-apple-consumer-package' || inputs.profile == 'identity-apple-consumer-desktop-package' || inputs.profile == 'identity-apple-ownership' || inputs.profile == 'identity-apple-webview-restore' || startsWith(inputs.profile, 'identity-apple-ui') || inputs.profile == 'identity-apple-main-ui' || inputs.profile == 'identity-apple-framework' || inputs.profile == 'identity-apple-sample' || inputs.profile == 'identity-linux-android-ownership') && 90 || 60 }}
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
      CARGO_BUILD_JOBS: '2'
      IDENTITY_STAGING_VERSION: '0.1.0-preview.1'
      IDENTITY_PROFILE: ${{ inputs.profile }}
      APPLE_CONSUMER_ENABLED: ${{ inputs.profile == 'identity-apple-consumer-package' || inputs.profile == 'identity-apple-consumer-desktop-package' }}
      ANDROID_WEBVIEW_FOCUS: ${{ inputs.profile == 'identity-linux-android-webview-restore' && 'webview-content-policy-android-restore' || 'webview-content-policy-android' }}
      ANDROID_REMOTE_IO_ENABLED: ${{ contains(fromJSON('["identity-linux-android-ownership","identity-linux-android-remote-io","identity-linux-android-remote-io-cancel"]'), inputs.profile) }}
      ANDROID_REMOTE_IO_FOCUS: ${{ inputs.profile == 'identity-linux-android-remote-io-cancel' && 'android-io-controlled-remote-cancel' || 'android-io-controlled-remote' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        id: checkout
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          verify-signature: true
          overwrite-settings: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          min-wrapper-count: 1
          allow-snapshots: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: false
          add-job-summary: never
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          # These prerequisites are all provided by the official Ubuntu sources.
          ubuntu_apt=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${ubuntu_apt[@]}" update
          sudo apt-get "${ubuntu_apt[@]}" install --no-install-recommends -y libgtk-3-dev libwayland-dev xvfb xauth
      - name: Admit the finite Android WebView device scope
        if: inputs.profile == 'identity-linux-android-webview-device' || inputs.profile == 'identity-linux-android-webview-restore'
        run: |
          python3 -B scripts/ci/android_device_tests.py plan --api-level 35 --module nativecmpkit-webview \
            --focus "$ANDROID_WEBVIEW_FOCUS" --output build/ci-verification/identity-android-webview-device > /dev/null
      - name: Admit the owned Camera and remote IO device scopes
        if: env.ANDROID_REMOTE_IO_ENABLED == 'true'
        run: |
          if [[ "$IDENTITY_PROFILE" == identity-linux-android-ownership ]]; then
            python3 -B scripts/ci/android_device_tests.py plan --api-level 35 --module nativecmpkit-camera-picker \
              --focus android-camera-callback-substitution --output build/ci-verification/identity-android-camera > /dev/null
          fi
          python3 -B scripts/ci/android_device_tests.py plan --api-level 35 --module nativecmpkit-io \
            --focus "$ANDROID_REMOTE_IO_FOCUS" --output build/ci-verification/identity-android-remote-io > /dev/null
      - name: Set up pinned Rust
        id: rust
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --no-self-update
      - name: Install the official Android SDK platform
        if: (runner.os == 'Linux' && runner.arch == 'X64') || startsWith(inputs.profile, 'identity-apple')
        shell: bash
        run: |
          sdkmanager="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --licenses < <(yes) > /dev/null
          packages=('cmdline-tools;23.0' 'platforms;android-37.0')
          if [[ "$IDENTITY_PROFILE" == identity-linux-android-consumer-webview ]]; then
            packages+=('build-tools;36.0.0' 'emulator' 'system-images;android-23;google_apis;x86_64')
          elif [[ "$IDENTITY_PROFILE" == identity-linux-android-webview-device || "$IDENTITY_PROFILE" == identity-linux-android-webview-restore || "$ANDROID_REMOTE_IO_ENABLED" == true ]]; then
            packages+=('build-tools;36.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64')
          fi
          "$sdkmanager" --sdk_root="$ANDROID_HOME" --install "${packages[@]}"
      - name: Provision the official SDK for the Linux ARM64 and Windows package profiles
        if: inputs.profile == 'identity-linux-arm64-package' || inputs.profile == 'identity-windows-package'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: cmdline-tools;23.0 platforms;android-37.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Source identity and migration checks
        if: runner.os == 'Linux'
        run: |
          python3 scripts/development/verify_namespace.py
          python3 scripts/migration/verify_migration.py
          python3 scripts/audit/source_inventory.py --check
          python3 scripts/development/validate_resolutions.py --check
          python3 scripts/development/generate_icon_catalogues.py --check
      - name: Verify NativeCmpKit on owned Android emulators
        if: inputs.profile == 'identity-linux-android-webview-device' || inputs.profile == 'identity-linux-android-webview-restore' || env.ANDROID_REMOTE_IO_ENABLED == 'true'
        run: |
          platform_tools="${ANDROID_HOME:?}/platform-tools"
          test -x "$platform_tools/adb"
          export PATH="$platform_tools:$PATH"
          command -v setfacl > /dev/null || sudo apt-get install -y acl
          prepare_kvm() {
            test -c /dev/kvm || return
            if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
              sudo setfacl -m "u:$(id -un):rw" /dev/kvm || return
            fi
            test -r /dev/kvm && test -w /dev/kvm
          }
          prepare_kvm
          if [[ "$ANDROID_REMOTE_IO_ENABLED" == true ]]; then
            result=0
            if [[ "$IDENTITY_PROFILE" == identity-linux-android-ownership ]]; then
              python3 -B scripts/ci/android_device_tests.py run --api-level 35 --module nativecmpkit-camera-picker \
                --focus android-camera-callback-substitution --output build/ci-verification/identity-android-camera || result=1
              prepare_kvm
            fi
            python3 -B scripts/ci/android_device_tests.py run --api-level 35 --module nativecmpkit-io \
              --focus "$ANDROID_REMOTE_IO_FOCUS" --output build/ci-verification/identity-android-remote-io || result=1
            exit "$result"
          fi
          python3 -B scripts/ci/android_device_tests.py run --api-level 35 --module nativecmpkit-webview \
            --focus "$ANDROID_WEBVIEW_FOCUS" --output build/ci-verification/identity-android-webview-device
      - name: Linux desktop tests with owned audio and FileChooser services
        if: inputs.profile == 'identity-linux'
        shell: bash
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- \
            install --no-install-recommends -y xdg-desktop-portal xdg-desktop-portal-gtk xdotool pulseaudio libasound2-plugins
          xvfb-run -a python3 scripts/ci/library_tests.py run --suite desktop \
            --output build/ci-verification/identity-linux-desktop --timeout 2700
      - name: Recheck Linux picker tests in an owned FileChooser session
        if: inputs.profile == 'identity-linux-picker'
        shell: bash
        run: |
          sudo apt-get -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- \
            install --no-install-recommends -y xdg-desktop-portal xdg-desktop-portal-gtk xdotool
          PYTHONPATH=scripts/ci xvfb-run -a python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          from picker_dialog_context import OwnedPickerPortal, SOURCE

          root = Path.cwd()
          output = root / "build/ci-verification/identity-linux-picker"
          output.mkdir(parents=True)
          module = "nativecmpkit-file-picker"
          plan = {"suite": "desktop", "expected": [{"module": module, "test_source_files": [SOURCE]}]}
          portal = OwnedPickerPortal(root, output, plan).start()
          command = ["./gradlew", f":{module}:desktopTest", "--max-workers=1", "--info",
                     "--no-parallel", "--no-configuration-cache", "--no-build-cache"]
          package = "io.github.apdelrahman1911.nativecmpkit.picker"
          for case in (
              "NativeLinuxPortalFunctionalityTest.cancellingEachDialogLeavesSourcesUntouchedAndAFreshNativeSessionCanStillOpen",
              "NativePickerComposeLifetimeTest.closingTheRealRegistryIdWhileItsDialogIsVisibleKeepsTheShowLeaseValid",
              "NativePickerComposeLifetimeTest.closingComposeWindowWithAnActualDialogVisibleCancelsDeliveryNotNativeOwnership",
          ):
              command.extend(["--tests", f"{package}.{case}"])
          try:
              result = subprocess.run(command, env=portal.environment, check=False)
          finally:
              portal.close()
          if not portal.receipt["clean_owned_shutdown"]:
              raise SystemExit("The owned portal did not shut down cleanly")
          raise SystemExit(result.returncode)
          PYTHON
      - name: Recheck migrated Desktop Picker MIME validation
        if: inputs.profile == 'identity-linux-picker-mime'
        run: |
          ./gradlew :nativecmpkit-file-picker:desktopTest \
            --tests io.github.apdelrahman1911.nativecmpkit.picker.platform.MimeFilterRegressionTest \
            --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
          python3 -B scripts/audit/summarize_junit.py --root nativecmpkit-file-picker \
            --output build/ci-identity/picker-mime-results.json --require-reports
          python3 -c 'import json; assert json.load(open("build/ci-identity/picker-mime-results.json"))["by_task"] == {"desktopTest": {"tests": 7, "failures": 0, "errors": 0, "skipped": 0}}'
      - name: Recheck the Linux desktop WebView cookie-path regression
        if: inputs.profile == 'identity-linux-webview'
        run: |
          ./gradlew :nativecmpkit-webview:desktopTest \
            --tests io.github.apdelrahman1911.nativecmpkit.ui.web.DesktopCookieRequestParityTest.realJdkRequestHeadersAndLibraryResultsKeepDuplicateNamesAcrossPathAndDomainScopes \
            --refresh-dependencies --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Prepare the exact Robolectric artifact from the Google Cloud Maven Central mirror
        if: inputs.profile == 'identity-linux-android' || inputs.profile == 'identity-linux-android-recovery'
        shell: bash
        run: |
          relative=org/robolectric/nativeruntime-dist-compat/1.0.18
          base=https://maven-central.storage-download.googleapis.com/maven2
          destination="build/ci-identity/robolectric-repo/$relative"
          mkdir -p "$destination"
          fetch() {
            local name="nativeruntime-dist-compat-1.0.18.$1"
            local path="$destination/$name"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --connect-timeout 15 --max-time 180 \
              "$base/$relative/$name" --output "$path.part"
            printf '%s  %s\n' "$2" "$path.part" | sha256sum -c -
            mv -- "$path.part" "$path"
          }
          # Digests are the canonical Maven Central checksums for these two files.
          fetch pom fca7dfc0e6a41dde9a3e835218c98628c0a8d4909679eda790ac684354fdfd70
          fetch jar a6c34d92c990754e5aee076032a36f8e38fcacb5eb878ebe0a324509f3864eef
      - name: Android host tests and sample APK
        if: inputs.profile == 'identity-linux-android'
        run: |
          ./gradlew testAndroidHostTest :sample:android:assembleDebug --continue --max-workers=1 \
            --init-script scripts/ci/robolectric-mirror.init.gradle.kts \
            --no-parallel --no-configuration-cache --no-build-cache
      - name: Recheck Android host tests blocked during dependency resolution
        if: inputs.profile == 'identity-linux-android-recovery'
        run: |
          ./gradlew :nativecmpkit-camera-picker:testAndroidHostTest :nativecmpkit-file-picker:testAndroidHostTest \
            :nativecmpkit-file-picker-coil:testAndroidHostTest :nativecmpkit-geo:testAndroidHostTest \
            :nativecmpkit-io:testAndroidHostTest :nativecmpkit-share:testAndroidHostTest \
            :nativecmpkit-ui:testAndroidHostTest :nativecmpkit-webview:testAndroidHostTest \
            :nativecmpkit-permissions:nativecmpkit-permissions-core:testAndroidHostTest :sample:common:testAndroidHostTest \
            --init-script scripts/ci/robolectric-mirror.init.gradle.kts \
            --continue --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Linux browser tests and sample compilation
        if: inputs.profile == 'identity-linux-browser'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          xvfb-run -a ./gradlew jsBrowserTest wasmJsBrowserTest \
            :sample:web-js:compileKotlinJs :sample:web-wasm:compileKotlinWasmJs \
            --continue --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Recheck browser camera baseline parser
        if: inputs.profile == 'identity-linux-browser-camera'
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          xvfb-run -a ./gradlew :nativecmpkit-camera-picker:jsBrowserTest \
            --tests io.github.apdelrahman1911.nativecmpkit.camerapicker.SettingsHomeTaskBaselineTest \
            --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Prepare an independent copy of the packaged consumer
        if: inputs.profile == 'identity-linux-consumer' || env.APPLE_CONSUMER_ENABLED == 'true'
        run: |
          python3 -B tests/consumer/native_consumer_carriage.py \
            --source-root "$PWD" --expected-source-revision "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/nativecmpkit-consumer"
      - name: Collect checked native dependency notices
        if: endsWith(inputs.profile, '-package') || inputs.profile == 'identity-linux-consumer'
        shell: bash
        run: |
          for module in nativecmpkit-file-picker nativecmpkit-share; do
            cargo fetch --locked --manifest-path "$module/native/Cargo.toml"
            python scripts/native/artifacts.py metadata --module "$module"
          done
          shopt -s nullglob
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          if [[ "$RUNNER_OS" == Windows ]]; then cargo_home="$(cygpath -u "$cargo_home")"; fi
          cache_arguments=()
          for cache in "$cargo_home"/registry/cache/*; do
            cache_arguments+=(--registry-cache "$cache")
          done
          test "${#cache_arguments[@]}" -gt 0
          for module in nativecmpkit-file-picker nativecmpkit-share; do
            python tests/consumer/collect_native_licenses.py \
              --metadata "build/native-metadata/$module.json" "${cache_arguments[@]}" \
              --vcs-supplements "$PWD/licenses/native-dependency-supplements" --source-root "$PWD" \
              --output "build/native-notices/$module"
          done
      - name: Stage isolated Maven publications
        if: endsWith(inputs.profile, '-package') || inputs.profile == 'identity-linux-consumer'
        id: identity-stage
        shell: bash
        env:
          TARGETS: ${{ (inputs.profile == 'identity-apple-package' || env.APPLE_CONSUMER_ENABLED == 'true') && 'all' || 'desktop' }}
        run: |
          kotlin_host_options=()
          if [[ "$IDENTITY_PROFILE" == identity-linux-arm64-package ]]; then
            test "$RUNNER_OS/$RUNNER_ARCH/$TARGETS" = Linux/ARM64/desktop
            # KGP supports the Desktop JVM publications on this host via this
            # opt-in. iOS publication targets stay outside the staging task.
            kotlin_host_options+=(-Pkotlin.internal.mpp.allowMultiplatformPublicationsOnUnsupportedHost=true)
          fi
          ./gradlew stageVerificationPublications \
            -PnativecmpkitVerification=true -PnativecmpkitVerificationTargets="$TARGETS" \
            -PnativeCmpkit.version="$IDENTITY_STAGING_VERSION" \
            --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache "${kotlin_host_options[@]}"
          test -d build/verification-repo
      - name: Inspect staged artifacts and native payload identity
        if: endsWith(inputs.profile, '-package')
        id: identity-artifacts
        shell: bash
        run: |
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) selection=(--target desktop --native-platform linux-x64) ;;
            Linux/ARM64) selection=(--target desktop --native-platform linux-arm64) ;;
            macOS/ARM64) selection=(--native-platform macos-arm64) ;;
            macOS/X64) selection=(--target desktop --native-platform macos-x64) ;;
            Windows/X64) selection=(--target desktop --native-platform windows-x64) ;;
            *) exit 1 ;;
          esac
          python tests/consumer/verify_artifacts.py \
            --repository build/verification-repo --version "$IDENTITY_STAGING_VERSION" \
            "${selection[@]}" --expected-native-revision "$GITHUB_SHA" \
            --output build/ci-identity/publication-artifacts.json
      - name: Verify staged desktop JNI exports
        if: ${{ !cancelled() && steps.identity-stage.outcome == 'success' }}
        shell: bash
        run: |
          PYTHONPATH=tests/consumer python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import zipfile
          from verify_artifacts import GROUP, NATIVE_MODULES, native_filename

          host = (os.environ["RUNNER_OS"], os.environ["RUNNER_ARCH"])
          platform, nm = {
              ("Linux", "X64"): ("linux-x64", ["nm", "-D", "--defined-only"]),
              ("Linux", "ARM64"): ("linux-arm64", ["nm", "-D", "--defined-only"]),
              ("macOS", "ARM64"): ("macos-arm64", ["xcrun", "nm", "-gU"]),
              ("macOS", "X64"): ("macos-x64", ["xcrun", "nm", "-gU"]),
              ("Windows", "X64"): ("windows-x64", ["llvm-readobj", "--coff-exports"]),
          }[host]
          version = os.environ["IDENTITY_STAGING_VERSION"]
          repository = Path("build/verification-repo") / GROUP.replace(".", "/")
          records = []
          with tempfile.TemporaryDirectory() as directory:
              for module in NATIVE_MODULES:
                  coordinate = module + "-desktop"
                  jar = repository / coordinate / version / f"{coordinate}-{version}.jar"
                  filename = native_filename(module, platform)
                  binary = Path(directory) / filename
                  with zipfile.ZipFile(jar) as archive:
                      binary.write_bytes(archive.read(f"native/{platform}/{filename}"))
                  output = subprocess.check_output([*nm, str(binary)], text=True)
                  exports = {symbol.removeprefix("_") for symbol in re.findall(r"\b_?Java_[A-Za-z0-9_]+\b", output)}
                  source = (Path(module) / "native/src/lib.rs").read_text()
                  expected = set(re.findall(r'pub extern "system" fn (Java_[A-Za-z0-9_]+)', source))
                  prefix = "Java_" + GROUP.replace(".", "_") + "_"
                  passed = bool(expected) and exports == expected and all(symbol.startswith(prefix) for symbol in exports)
                  records.append({"module": module, "platform": platform, "expected": sorted(expected),
                                  "exports": sorted(exports), "passed": passed})
          output = Path("build/ci-identity/jni-exports.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps({"revision": os.environ["GITHUB_SHA"], "binaries": records}, indent=2) + "\n")
          raise SystemExit(0 if all(record["passed"] for record in records) else 1)
          PY
      - name: Inspect JVM declarations in the renamed staged Maven artifacts
        if: inputs.profile == 'identity-linux-consumer'
        run: |
          PYTHONPATH=tests/consumer python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from jvm_abi import snapshot_jars
          from verify_artifacts import GROUP

          identity = json.loads(Path("docs/migration/current-identity.json").read_text())
          version = os.environ["IDENTITY_STAGING_VERSION"]
          repository = Path("build/verification-repo") / GROUP.replace(".", "/")
          coordinates = [module["new_artifact"] + "-desktop" for module in identity["modules"]]
          jars = {coordinate: repository / coordinate / version / f"{coordinate}-{version}.jar"
                  for coordinate in coordinates}
          result = snapshot_jars(jars, os.environ["GITHUB_SHA"], "Local staged desktop Maven variants")
          inspected = sum(artifact["class_count_inspected"] for artifact in result["artifacts"].values())
          exported = sum(artifact["exported_class_count"] for artifact in result["artifacts"].values())
          if not inspected or not exported:
              raise SystemExit("Missing staged NativeCmpKit JVM declarations")
          print(f"Inspected {inspected} JVM classes and {exported} exported classes in {len(jars)} Maven artifacts")
          output = Path("build/ci-identity/jvm-api.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(result, indent=2) + "\n")
          PY
      - name: Test renamed desktop JNI from independent Maven dependencies
        if: inputs.profile == 'identity-linux-consumer'
        run: |
          ./gradlew -p "$RUNNER_TEMP/nativecmpkit-consumer/independent-consumer" \
            verifyCandidateResolution verifyNativeConsumerResults \
            -PnativecmpkitRepository="$PWD/build/verification-repo" \
            -PnativecmpkitVersion="$IDENTITY_STAGING_VERSION" \
            -PconsumerTargets=desktop -PnativecmpkitConsumerTestFocus=native \
            -PnativecmpkitExpectedNativeRevision="$GITHUB_SHA" -PnativecmpkitProducerSourceRoot="$PWD" \
            --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache
      - name: Test independent Maven resolution and selected platform runtimes
        if: env.APPLE_CONSUMER_ENABLED == 'true'
        shell: bash
        run: |
          test "$RUNNER_OS/$RUNNER_ARCH" = macOS/ARM64
          consumer="$RUNNER_TEMP/nativecmpkit-consumer/independent-consumer"
          mkdir -p build/ci-identity/consumer
          tasks=(verifyCandidateResolution desktopTest)
          if [[ "$IDENTITY_PROFILE" == identity-apple-consumer-package ]]; then
            tasks+=(testAndroidHostTest iosSimulatorArm64Test linkDebugFrameworkIosArm64)
          fi
          status=0
          ./gradlew -p "$consumer" \
            "${tasks[@]}" \
            -PnativecmpkitRepository="$PWD/build/verification-repo" \
            -PnativecmpkitVersion="$IDENTITY_STAGING_VERSION" -PconsumerTargets=desktop,android,ios \
            -PnativecmpkitExpectedNativeRevision="$GITHUB_SHA" -PnativecmpkitProducerSourceRoot="$PWD" \
            --continue --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache || status=$?
          if [[ "$status" == 0 || -f "$consumer/build/reports/consumer-resolution.txt" ]]; then
            mv "$consumer/build/reports/consumer-resolution.txt" build/ci-identity/consumer/consumer-resolution-platforms.txt
          fi
          exit "$status"
      - name: Test independent Maven resolution in JS and Wasm browsers
        if: ${{ !cancelled() && inputs.profile == 'identity-apple-consumer-package' && steps.identity-artifacts.outcome == 'success' }}
        shell: bash
        run: |
          test "$RUNNER_OS/$RUNNER_ARCH" = macOS/ARM64
          web_tools="$RUNNER_TEMP/nativecmpkit-consumer-web-tools"
          mkdir "$web_tools"
          node_archive=node-v24.16.0-darwin-arm64.tar.xz
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            "https://nodejs.org/dist/v24.16.0/$node_archive" --output "$web_tools/$node_archive"
          (cd "$web_tools" && printf 'e28ad5531b2aafe0ea555a51b2412c42fdc0f91a6a53fbd03ac93e3847e91389  %s\n' "$node_archive" | shasum -a 256 -c -)
          tar -xJf "$web_tools/$node_archive" -C "$web_tools"
          export PATH="$web_tools/node-v24.16.0-darwin-arm64/bin:$PATH"
          test "$(node --version)" = v24.16.0
          test "$(yarn --version)" = 1.22.22
          export CHROME_BIN='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          test -x "$CHROME_BIN"
          consumer="$RUNNER_TEMP/nativecmpkit-consumer/independent-consumer"
          mkdir -p build/ci-identity/consumer
          status=0
          ./gradlew -p "$consumer" \
            verifyCandidateResolution jsBrowserTest wasmJsBrowserTest \
            -PnativecmpkitRepository="$PWD/build/verification-repo" \
            -PnativecmpkitVersion="$IDENTITY_STAGING_VERSION" -PconsumerTargets=web \
            --continue --max-workers=1 --no-parallel --no-configuration-cache --no-build-cache || status=$?
          if [[ "$status" == 0 || -f "$consumer/build/reports/consumer-resolution.txt" ]]; then
            mv "$consumer/build/reports/consumer-resolution.txt" build/ci-identity/consumer/consumer-resolution-web.txt
          fi
          exit "$status"
      - name: Require fresh consumer JUnit counts for the selected runtime targets
        if: ${{ !cancelled() && env.APPLE_CONSUMER_ENABLED == 'true' }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/nativecmpkit-consumer/independent-consumer"
          receipt=build/ci-identity/consumer/target-junit-summary.json
          python3 scripts/audit/summarize_junit.py --root "$root" --output "$receipt" --require-reports
          python3 - "$receipt" "$IDENTITY_PROFILE" <<'PY'
          import json
          import sys
          from pathlib import Path

          reports = json.loads(Path(sys.argv[1]).read_text())["by_task"]
          expected = {"desktopTest": 19}
          if sys.argv[2] == "identity-apple-consumer-package":
              expected.update(testAndroidHostTest=10, jsBrowserTest=11, wasmJsBrowserTest=11, iosSimulatorArm64Test=10)
          elif sys.argv[2] != "identity-apple-consumer-desktop-package":
              raise SystemExit("Unsupported Apple consumer profile")
          if set(reports) != set(expected) or any(
              reports[task] != {"tests": count, "failures": 0, "errors": 0, "skipped": 0}
