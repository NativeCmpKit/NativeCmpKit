            --max-workers=2 --no-configuration-cache --no-build-cache
          mkdir -p build/ci-identity
          cat > build/ci-identity/framework-consumer.swift <<'SWIFT'
          import NativeCmpKit
          import UIKit
          public func makeViewController() -> UIViewController { Main_iosKt.MainViewController() }
          SWIFT
          for runtime in ios iphonesimulator; do
            case "$runtime" in
              ios) target=iosArm64; sdk=iphoneos; triple=arm64-apple-ios18.5; platform=IOS; platform_id=2 ;;
              iphonesimulator) target=iosSimulatorArm64; sdk=iphonesimulator; triple=arm64-apple-ios18.5-simulator; platform=IOSSIMULATOR; platform_id=7 ;;
            esac
            directory="sample/common/build/bin/$target/debugFramework"
            framework="$directory/NativeCmpKit.framework"
            consumer="build/ci-identity/framework-consumer-$target.dylib"
            receipt=build/ci-identity/framework-identity.txt
            printf 'target=%s phase=framework-metadata\n' "$target" | tee -a "$receipt"
            bundle=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$framework/Info.plist")
            executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$framework/Info.plist")
            architecture=$(xcrun lipo -archs "$framework/NativeCmpKit")
            printf 'bundle=%q executable=%q architecture=%q\n' "$bundle" "$executable" "$architecture" | tee -a "$receipt"
            test "$bundle" = io.github.apdelrahman1911.nativecmpkit.framework
            test "$executable" = NativeCmpKit
            test "$architecture" = arm64
            printf 'target=%s phase=module-map\n' "$target" | tee -a "$receipt"
            grep -Eq '^framework module "NativeCmpKit"[[:space:]]*\{$' \
              "$framework/Modules/module.modulemap"
            printf 'target=%s phase=swift-link\n' "$target" | tee -a "$receipt"
            xcrun --sdk "$sdk" swiftc -emit-library -target "$triple" -sdk "$(xcrun --sdk "$sdk" --show-sdk-path)" \
              -F "$directory" -framework NativeCmpKit build/ci-identity/framework-consumer.swift -o "$consumer"
            architecture=$(xcrun lipo -archs "$consumer")
            observed_platform=$(xcrun vtool -show-build "$consumer" | awk '$1 == "platform" {print toupper($2)}')
            printf 'target=%s phase=swift-linked consumer_platform=%q architecture=%q\n' \
              "$target" "$observed_platform" "$architecture" | tee -a "$receipt"
            test "$architecture" = arm64
            [[ "$observed_platform" == "$platform" || "$observed_platform" == "$platform_id" ]]
            shasum -a 256 "$framework/NativeCmpKit" "$framework/Info.plist" "$framework/Modules/module.modulemap" "$consumer" \
              | tee -a "$receipt"
          done
