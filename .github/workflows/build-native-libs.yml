          reports="$carriage/independent-consumer/build/reports"
          mkdir -p build/ci-identity/consumer
          shopt -s nullglob
          for receipt in "$carriage/carriage.json" "$reports/consumer-resolution.txt" \
            "$reports"/native-consumer/*/{package-preflight,native-results}.json; do
            if [[ -f "$receipt" ]]; then cp -- "$receipt" build/ci-identity/consumer/; fi
          done
