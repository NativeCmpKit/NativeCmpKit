# NativeCmpKit showcase verification.
#
# Builds the real sample/showcase application on both mobile platforms and,
# when ci/showcase-mode contains "session", opens a live ui-test-actions
# session for the external agent. The ui-test-actions composite action is not
# on this repository's Actions allowlist, so the reviewed upstream scripts are
# cloned at a pinned commit and executed directly. Only allowlisted actions are
# used by this workflow.
name: Showcase UI verification

on:
  push:
    branches: [feature/showcase-ui-verification]
    paths:
      - 'ci/showcase-mode'
      - 'ci/showcase-trigger'
  workflow_dispatch:
    inputs:
      mode:
        description: build or session
        type: choice
        options: [build, session]
        default: build
      platform:
        description: both, android, or ios
        type: choice
        options: [both, android, ios]
        default: both
      device_class:
        description: phone or tablet
        type: choice
        options: [phone, tablet]
        default: phone
      duration_minutes:
        description: Live session minutes after readiness
        type: string
        default: '60'

permissions:
  contents: read

concurrency:
  group: showcase-ui-${{ github.ref }}-${{ github.event_name }}-${{ inputs.platform || 'push' }}
  cancel-in-progress: false

env:
  UI_TEST_ACTIONS_REF: 1c0d90debd7319c7580279bcbe2fb5ab19d6feea
  ANDROID_APP_ID: io.github.apdelrahman1911.nativecmpkit.sample
  IOS_BUNDLE_ID: io.github.apdelrahman1911.nativecmpkit.sample
  AXE_VERSION: v2.1.1
  AXE_SHA256: 8788838b1b32059d143cf06541b72fcaead85c16274457cdbff086510a5b17fa

jobs:
  android:
    if: >-
      github.repository == 'NativeCmpKit/NativeCmpKit' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, allowlisted
        with:
          persist-credentials: false

      - name: Select showcase mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode='${{ inputs.mode }}'
            duration='${{ inputs.duration_minutes }}'
          else
            mode=$(tr -d '[:space:]' < ci/showcase-mode)
            duration=60
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            device_class='${{ inputs.device_class }}'
          else
            device_class=phone
          fi
          case "$device_class" in phone|tablet) ;; *) echo "Unknown device class: $device_class" >&2; exit 2 ;; esac
          case "$mode" in build|session) ;; *) echo "Unknown showcase mode: $mode" >&2; exit 2 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "device_class=$device_class" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, allowlisted
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6, allowlisted

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6, allowlisted

      - name: Check showcase manifests and flows
        shell: bash
        run: |
          python3 showcase/generate_coverage.py
          git diff --exit-code -- showcase/coverage.json showcase/COVERAGE.md
          python3 showcase/automation/check_flows.py
          python3 showcase/automation/check_dispatch.py

      - name: Install Android SDK and emulator image
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-37.0' 'platforms;android-35' \
            'build-tools;35.0.0' 'platform-tools' 'emulator' \
            'system-images;android-35;google_apis;x86_64'

      - name: Build the debug APK
        shell: bash
        run: |
          delays=(60 180 300)
          for attempt in 1 2 3 4; do
            if ./gradlew :sample:android:assembleDebug --no-configuration-cache --max-workers=2 \
              '-Dorg.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8' \
              -Pkotlin.compiler.execution.strategy=in-process; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then exit 1; fi
            delay=${delays[$((attempt-1))]}
            echo "Gradle build failed (attempt $attempt); cooling down ${delay}s for repository throttling" >&2
            sleep "$delay"
          done
          apk=$(find sample/android/build/outputs/apk/debug -name '*.apk' -type f | head -1)
          test -n "$apk"
          echo "SHOWCASE_APK=$(realpath "$apk")" >> "$GITHUB_ENV"
          echo "APK: $(realpath "$apk")"

      - name: Record the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, allowlisted
        with:
          name: showcase-android-apk-${{ github.run_attempt }}
          path: ${{ env.SHOWCASE_APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Create a KVM-ready API 35 emulator
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          adb version
          sudo chmod 666 /dev/kvm
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/showcase-avds"
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          adb start-server
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name showcase --package 'system-images;android-35;google_apis;x86_64' \
            --path "$ANDROID_AVD_HOME/showcase.avd" --device 'pixel_6' 
          nohup "$ANDROID_HOME/emulator/emulator" -avd showcase -port 5554 \
            -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 420 bash -c '
            until [[ "$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do
              sleep 2
            done'
          adb -s emulator-5554 shell input keyevent KEYCODE_WAKEUP
          adb -s emulator-5554 shell wm dismiss-keyguard
          if [[ "${{ steps.mode.outputs.device_class }}" == "tablet" ]]; then
            adb -s emulator-5554 shell wm size 1600x2560
            adb -s emulator-5554 shell wm density 320
          else
            adb -s emulator-5554 shell wm size 1080x2400
            adb -s emulator-5554 shell wm density 420
          fi
          adb -s emulator-5554 shell settings put system font_scale 1.0
          adb -s emulator-5554 shell mkdir -p /sdcard/Download || true
          sleep 2
          adb -s emulator-5554 push "$GITHUB_WORKSPACE/showcase/fixtures/kira-fixture.txt" /sdcard/Download/kira-fixture.txt || \
            adb -s emulator-5554 push "$GITHUB_WORKSPACE/showcase/fixtures/kira-fixture.txt" /data/local/tmp/kira-fixture.txt || true
          adb -s emulator-5554 push "$GITHUB_WORKSPACE/showcase/fixtures/kira-fixture.png" /sdcard/Download/kira-fixture.png || \
            adb -s emulator-5554 push "$GITHUB_WORKSPACE/showcase/fixtures/kira-fixture.png" /data/local/tmp/kira-fixture.png || true
          adb -s emulator-5554 shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Download/kira-fixture.png || true
          adb -s emulator-5554 shell ls -l /sdcard/Download/kira-fixture.txt /data/local/tmp/kira-fixture.txt 2>/dev/null || true
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell getprop ro.build.version.release
          adb -s emulator-5554 shell wm size
          adb -s emulator-5554 shell wm density

      - name: Create a disposable Python environment
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/uivenv"
          "$RUNNER_TEMP/uivenv/bin/python" -m pip install --disable-pip-version-check --upgrade pip
          "$RUNNER_TEMP/uivenv/bin/python" --version

      - name: Check out the pinned ui-test-actions scripts
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ui-test-actions/ui-test-actions.git \
            "$RUNNER_TEMP/ui-test-actions"
          git -C "$RUNNER_TEMP/ui-test-actions" checkout "$UI_TEST_ACTIONS_REF"
          test "$(git -C "$RUNNER_TEMP/ui-test-actions" rev-parse HEAD)" = "$UI_TEST_ACTIONS_REF"
          python3 --version

      - name: Resolve the one-time token digest
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "A workflow_dispatch session uses the committed digest file." >&2
          fi
          digest=$(tr -d '[:space:]' < ci/showcase-android.sha256)
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ci/showcase-android.sha256 must contain one lowercase SHA-256 digest" >&2
            exit 2
          fi
          echo "UI_TEST_TOKEN_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Open the Android live UI session
        id: start
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        env:
          UI_TEST_TARGET: android
          UI_TEST_DURATION: ${{ steps.mode.outputs.duration }}
          UI_TEST_STARTUP_TIMEOUT: '420'
          UI_TEST_DEVICE: emulator-5554
          UI_TEST_APP_IDS: ${{ env.ANDROID_APP_ID }}
          UI_TEST_DEEPLINK_SCHEMES: kira
          UI_TEST_TRANSPORT: auto
          UI_TEST_TRANSPORT_FALLBACK: none
          UI_TEST_ANDROID_IME: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          UI_TEST_APP_INSTALLS="{\"$ANDROID_APP_ID\":\"$SHOWCASE_APK\"}"
          export UI_TEST_APP_INSTALLS
          echo "UI_TEST_APP_INSTALLS=$UI_TEST_APP_INSTALLS" >> "$GITHUB_ENV"
          export UI_TEST_LAUNCH
          UI_TEST_LAUNCH=$(cat <<'EOF'
          adb -s emulator-5554 install -r "$SHOWCASE_APK"
          adb -s emulator-5554 shell am start -W -n "$ANDROID_APP_ID/io.github.apdelrahman1911.kira.sample.MainActivity"
          EOF
          )
          export UI_TEST_READY
          UI_TEST_READY='adb -s emulator-5554 shell dumpsys activity activities | grep -Eq "mResumedActivity.*${ANDROID_APP_ID}|topResumedActivity.*${ANDROID_APP_ID}"'
          cd "$RUNNER_TEMP/ui-test-actions"
          "$RUNNER_TEMP/uivenv/bin/python" lifecycle.py start

      - name: Publish the Android connection artifact
        id: publish
        if: steps.mode.outputs.mode == 'session' && steps.start.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, allowlisted
        with:
          name: ui-session-android-${{ steps.mode.outputs.device_class }}-${{ github.run_attempt }}-${{ steps.start.outputs.session-id }}
          path: ${{ steps.start.outputs.file }}
          if-no-files-found: error
          retention-days: 1

      - name: Hold the Android session open
        if: steps.mode.outputs.mode == 'session' && success() && steps.start.outcome == 'success'
        shell: bash
        env:
          UI_TEST_ACTION_PATH: ${{ runner.temp }}/ui-test-actions
          UI_TEST_DURATION: ${{ steps.mode.outputs.duration }}
          UI_TEST_CONNECTION_FILE: ${{ steps.start.outputs.file }}
          UI_TEST_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PYTHONUNBUFFERED: '1'
        run: |
          "$RUNNER_TEMP/uivenv/bin/python" "$UI_TEST_ACTION_PATH/lifecycle.py" hold

      - name: Retain emulator and Java diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, allowlisted
        with:
          name: showcase-android-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/emulator.log
            sample/android/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    if: >-
      github.repository == 'NativeCmpKit/NativeCmpKit' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform == 'both' || inputs.platform == 'ios')
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, allowlisted
        with:
          persist-credentials: false

      - name: Select showcase mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mode='${{ inputs.mode }}'
            duration='${{ inputs.duration_minutes }}'
          else
            mode=$(tr -d '[:space:]' < ci/showcase-mode)
            duration=60
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            device_class='${{ inputs.device_class }}'
          else
            device_class=phone
          fi
          case "$device_class" in phone|tablet) ;; *) echo "Unknown device class: $device_class" >&2; exit 2 ;; esac
          case "$mode" in build|session) ;; *) echo "Unknown showcase mode: $mode" >&2; exit 2 ;; esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          echo "device_class=$device_class" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5, allowlisted
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6, allowlisted

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6, allowlisted

      - name: Build the iOS simulator app
        shell: bash
        run: |
          delays=(60 180 300)
          for attempt in 1 2 3 4; do
            if xcodebuild -project sample/ios/Kira.xcodeproj -scheme Kira \
              -configuration Debug -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath build ARCHS=arm64 EXCLUDED_ARCHS=x86_64 \
              CODE_SIGNING_ALLOWED=NO build; then
              break
            fi
            if [[ "$attempt" == 4 ]]; then exit 1; fi
            delay=${delays[$((attempt-1))]}
            echo "xcodebuild failed (attempt $attempt); cooling down ${delay}s for repository throttling" >&2
            sleep "$delay"
          done
          app=$(find build/Build/Products -maxdepth 2 -name '*.app' -type d | head -1)
          test -n "$app"
          echo "SHOWCASE_IOS_APP=$(realpath "$app")" >> "$GITHUB_ENV"
          echo "APP: $(realpath "$app")"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"

      - name: Record the build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, allowlisted
        with:
          name: showcase-ios-app-${{ github.run_attempt }}
          path: ${{ env.SHOWCASE_IOS_APP }}
          if-no-files-found: error
          retention-days: 7

      - name: Select and boot one explicit iPhone simulator
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          chosen=$(python3 - "$RUNNER_TEMP/devices.json" "${{ steps.mode.outputs.device_class }}" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))["devices"]
          preferred = (
              ["iPad Pro 13-inch (M4)", "iPad Pro 12.9-inch (6th generation)",
               "iPad Air 13-inch (M3)", "iPad Air 11-inch (M3)"]
              if sys.argv[2] == "tablet"
              else ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 16", "iPhone 15"]
          )
          available = [
              (runtime, device)
              for runtime in sorted(data)
              if ".iOS-" in runtime
              for device in data[runtime]
              if device["isAvailable"]
              and (device["name"].startswith("iPad") if sys.argv[2] == "tablet"
                   else device["name"].startswith("iPhone"))
          ]
          for name in preferred:
              for runtime, device in reversed(available):
                  if device["name"] == name:
                      print(runtime, device["name"], device["udid"], sep="\t")
                      raise SystemExit
          if available:
              runtime, device = available[-1]
              print(runtime, device["name"], device["udid"], sep="\t")
              raise SystemExit
          raise SystemExit("No available simulator")
          PY
          )
          device_name=$(printf '%s' "$chosen" | cut -f2)
          device_udid=$(printf '%s' "$chosen" | cut -f3)
          test -n "$device_udid"
          echo "Selected simulator: $chosen"
          echo "UI_DEVICE=$device_udid" >> "$GITHUB_ENV"
          echo "UI_DEVICE_NAME=$device_name" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$device_udid" -b
          xcrun simctl list devices booted
          xcrun simctl addmedia "$device_udid" "$GITHUB_WORKSPACE/showcase/fixtures/kira-fixture.png" \
            || echo "warning: could not seed the photo fixture" >&2
          open -a Simulator --args -CurrentDeviceUDID "$device_udid"

      - name: Install the AXe accessibility helper
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          work="$RUNNER_TEMP/axe"
          mkdir -p "$work"
          asset=AXe-macOS-${AXE_VERSION}-universal.tar.gz
          curl -fsSL --retry 3 \
            "https://github.com/cameroncooke/AXe/releases/download/${AXE_VERSION}/${asset}" \
            -o "$work/$asset"
          printf '%s  %s\n' "$AXE_SHA256" "$work/$asset" | shasum -a 256 -c -
          tar -xzf "$work/$asset" -C "$work"
          axe=$(find "$work" -name axe -type f -print -quit)
          test -x "$axe"
          echo "AXE_BINARY=$axe" >> "$GITHUB_ENV"
          "$axe" --version || true

      - name: Create a disposable Python environment
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/uivenv"
          "$RUNNER_TEMP/uivenv/bin/python" -m pip install --disable-pip-version-check --upgrade pip
          "$RUNNER_TEMP/uivenv/bin/python" --version

      - name: Check out the pinned ui-test-actions scripts
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/ui-test-actions/ui-test-actions.git \
            "$RUNNER_TEMP/ui-test-actions"
          git -C "$RUNNER_TEMP/ui-test-actions" checkout "$UI_TEST_ACTIONS_REF"
          test "$(git -C "$RUNNER_TEMP/ui-test-actions" rev-parse HEAD)" = "$UI_TEST_ACTIONS_REF"
          python3 --version

      - name: Resolve the one-time token digest
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          digest=$(tr -d '[:space:]' < ci/showcase-ios.sha256)
          if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            echo "ci/showcase-ios.sha256 must contain one lowercase SHA-256 digest" >&2
            exit 2
          fi
          echo "UI_TEST_TOKEN_SHA256=$digest" >> "$GITHUB_ENV"

      - name: Install, launch, and probe the iOS app
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        run: |
          xcrun simctl install "$UI_DEVICE" "$SHOWCASE_IOS_APP"
          xcrun simctl launch "$UI_DEVICE" "$IOS_BUNDLE_ID"
          axe_ready=0
          for attempt in 1 2 3 4 5; do
            if "$AXE_BINARY" describe-ui --udid "$UI_DEVICE" > "$RUNNER_TEMP/axe/preflight.json" \
               && python3 -c 'import json,sys; assert len(json.load(open(sys.argv[1]))[0]["children"]) > 0' "$RUNNER_TEMP/axe/preflight.json"; then
              axe_ready=1
              break
            fi
            sleep 3
          done
          if [[ "$axe_ready" == 1 ]]; then
            echo "AXE_READY=1" >> "$GITHUB_ENV"
          else
            echo "AXe preflight did not expose application elements; the session will use the visible Simulator." >&2
            echo "AXE_READY=0" >> "$GITHUB_ENV"
          fi
          xcrun simctl io "$UI_DEVICE" screenshot "$RUNNER_TEMP/axe/preflight.png"
          python3 -c 'import sys; p=open(sys.argv[1],"rb").read(8); assert p==b"\x89PNG\r\n\x1a\n"' "$RUNNER_TEMP/axe/preflight.png"
          xcrun simctl spawn "$UI_DEVICE" launchctl list | grep -F "UIKitApplication:${IOS_BUNDLE_ID}"

      - name: Open the iOS live UI session
        id: start
        if: steps.mode.outputs.mode == 'session'
        shell: bash
        env:
          UI_TEST_TARGET: ios
          UI_TEST_DURATION: ${{ steps.mode.outputs.duration }}
          UI_TEST_STARTUP_TIMEOUT: '300'
          UI_TEST_DEVICE: ${{ env.UI_DEVICE }}
          UI_TEST_APP_IDS: ${{ env.IOS_BUNDLE_ID }}
          UI_TEST_TRANSPORT: auto
          UI_TEST_TRANSPORT_FALLBACK: none
          UI_TEST_IOS_AXE: ${{ env.AXE_READY == '1' && env.AXE_BINARY || '' }}
          PYTHONUNBUFFERED: '1'
        run: |
          UI_TEST_APP_INSTALLS="{\"$IOS_BUNDLE_ID\":\"$SHOWCASE_IOS_APP\"}"
          export UI_TEST_APP_INSTALLS
          echo "UI_TEST_APP_INSTALLS=$UI_TEST_APP_INSTALLS" >> "$GITHUB_ENV"
          export UI_TEST_LAUNCH
          UI_TEST_LAUNCH=$(cat <<'EOF'
          xcrun simctl terminate "$UI_DEVICE" "$IOS_BUNDLE_ID" || true
          xcrun simctl install "$UI_DEVICE" "$SHOWCASE_IOS_APP"
          xcrun simctl launch "$UI_DEVICE" "$IOS_BUNDLE_ID"
          EOF
          )
          export UI_TEST_READY
          UI_TEST_READY='xcrun simctl spawn "$UI_DEVICE" launchctl list | grep -Fq "UIKitApplication:${IOS_BUNDLE_ID}"'
          cd "$RUNNER_TEMP/ui-test-actions"
          "$RUNNER_TEMP/uivenv/bin/python" lifecycle.py start

      - name: Publish the iOS connection artifact
        id: publish
        if: steps.mode.outputs.mode == 'session' && steps.start.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, allowlisted
        with:
          name: ui-session-ios-${{ steps.mode.outputs.device_class }}-${{ github.run_attempt }}-${{ steps.start.outputs.session-id }}
          path: ${{ steps.start.outputs.file }}
          if-no-files-found: error
          retention-days: 1

      - name: Hold the iOS session open
        if: steps.mode.outputs.mode == 'session' && success() && steps.start.outcome == 'success'
        shell: bash
        env:
          UI_TEST_ACTION_PATH: ${{ runner.temp }}/ui-test-actions
          UI_TEST_DURATION: ${{ steps.mode.outputs.duration }}
          UI_TEST_CONNECTION_FILE: ${{ steps.start.outputs.file }}
          UI_TEST_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          PYTHONUNBUFFERED: '1'
        run: |
          "$RUNNER_TEMP/uivenv/bin/python" "$UI_TEST_ACTION_PATH/lifecycle.py" hold

      - name: Retain simulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, allowlisted
        with:
          name: showcase-ios-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/axe/preflight.json
            ${{ runner.temp }}/axe/preflight.log
            build/Build/Products/
